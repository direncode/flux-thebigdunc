# =============================================================================
# PANOPTICON DARK KNIGHT — SOURCE CATALOG v2
# =============================================================================
# 100+ free intelligence sources. Zero API keys. Zero signup.
# GDELT backbone for OSINT / social / X intelligence.
#
# "The sonar gives you a picture of the whole city."
# =============================================================================

sources:

  # ===========================================================================
