  # GDELT processes global news, social media (including X/Twitter),
  # broadcast TV in 65 languages. This is your OSINT backbone.

  - id: gdelt_geo_conflict
    name: "GDELT Conflict Intelligence"
    category: osint
    enabled: true
    priority: 1
    base_url: "https://api.gdeltproject.org/api/v2/geo/geo"
    auth_type: none
    poll_interval_seconds: 300
    rate_limit_per_minute: 20
    timeout_seconds: 30
    method: GET
    params:
      query: "conflict OR attack OR strike OR bombing OR shelling"
      format: GeoJSON
      mode: PointData
      timespan: 60min
    response_format: geojson
    results_path: features
    field_mapping:
      lat: "geometry.coordinates[1]"
      lon: "geometry.coordinates[0]"
      timestamp: "properties.urlpubtimedate"
      timestamp_format: iso8601
      confidence: "_static:0.65"
    observable_type: armed_conflict
    extra_fields:
      url: "properties.url"
      name: "properties.name"
      shareimage: "properties.shareimage"
      tone: "properties.tone"

