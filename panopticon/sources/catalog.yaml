  - id: osm_overpass
    name: "OpenStreetMap Overpass"
    category: infrastructure
    enabled: false
    priority: 3
    base_url: "https://overpass-api.de/api/interpreter"
    auth_type: none
    poll_interval_seconds: 86400
    rate_limit_per_minute: 2
    timeout_seconds: 60
    request:
      method: GET
      params:
        data: '[out:json];node["power"="plant"]({bbox_south},{bbox_west},{bbox_north},{bbox_east});out body;'
    response_format: json
    results_path: elements
    field_mapping:
      lat: lat
      lon: lon
