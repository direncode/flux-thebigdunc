[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "panopticon-dark-knight"
version = "0.1.0"
description = "Multi-source intelligence foresight engine for cascading event detection."
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "requests>=2.28",
    "pyyaml>=6.0",
    "streamlit>=1.30",
    "plotly>=5.18",
    "folium>=0.15",
    "streamlit-folium>=0.18",
    "streamlit-autorefresh>=1.0",
]

[project.scripts]
panopticon = "panopticon.main:main"
